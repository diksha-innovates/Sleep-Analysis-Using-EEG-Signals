name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # prophet/tensorflow are optional, heavy, and already handled by
      # graceful-skip logic in timeseries_models.py -- CI only installs the
      # core deps so the suite stays fast; the optional-dependency code
      # paths are still exercised (as "skipped", not "ok").
      - name: Install core dependencies
        run: |
          pip install numpy pandas scikit-learn statsmodels matplotlib seaborn mne pmdarima pytest

      - name: Run tests
        run: pytest -v
